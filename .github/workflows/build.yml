name: Byg Berlin Sightrun

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHubs Ubuntu-maskiner har Android SDK installeret (ANDROID_HOME); Gradle henter selv manglende dele.
      - name: Accepter Android-licenser
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Gør gradlew kørbar
        run: chmod +x ./gradlew

      - name: Kør tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Med signeringsnøgle i GitHub-hemmeligheder bygges en udgivelsesklar APK; ellers en debug-signeret.
      - name: Gem signeringsnøgle
        if: env.HAS_SIGNING_KEY == 'true'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Byg APK
        env:
          SIGNING_STORE_FILE: ${{ env.HAS_SIGNING_KEY == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Saml APK-filer
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/berlin-sightrun-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/berlin-sightrun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: berlin-sightrun-apk
          path: out/*.apk

      - name: Udgiv på GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
