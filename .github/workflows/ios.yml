name: Byg Berlin Sightrun til iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # iOS og Android skal bruge præcis samme rute, fortællinger og faste tekster.
      - name: Tjek at ruten er den samme som i Android-appen
        run: cmp app/src/main/assets/route/berlin_sightrun.json ios/BerlinSightrun/Resources/berlin_sightrun.json

      - name: Tjek at teksterne er de samme som i Android-appen
        run: python3 ios/tools/gen_strings.py --check

      - name: Vælg nyeste Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Kør tests i simulatoren
        shell: bash {0}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          for k in reversed(ios):
              phones = [x for x in d[k] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project ios/BerlinSightrun.xcodeproj \
            -scheme BerlinSightrun \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|Test Case .* (passed|failed)|XCTAssert|\*\* " test.log || true
          [ $status -eq 0 ] || tail -80 test.log
          exit $status

      - name: Byg til iPhone (uden signering)
        shell: bash {0}
        run: |
          xcodebuild build \
            -project ios/BerlinSightrun.xcodeproj \
            -scheme BerlinSightrun \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:|\*\* " build.log || true
          [ $status -eq 0 ] || tail -80 build.log
          exit $status
