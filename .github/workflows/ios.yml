name: Byg Berlin Sightrun til iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # iOS og Android skal bruge præcis samme rute, fortællinger og faste tekster.
      - name: Tjek at ruten er den samme som i Android-appen
        run: cmp app/src/main/assets/route/berlin_sightrun.json ios/BerlinSightrun/Resources/berlin_sightrun.json

      - name: Tjek at teksterne er de samme som i Android-appen
        run: python3 ios/tools/gen_strings.py --check

      - name: Vælg nyeste Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Kør tests i simulatoren
        shell: bash {0}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          for k in reversed(ios):
              phones = [x for x in d[k] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break')
          echo "Simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild test \
            -derivedDataPath build/dd \
            -project ios/BerlinSightrun.xcodeproj \
            -scheme BerlinSightrun \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|Test Case .* (passed|failed)|XCTAssert|\*\* " test.log || true
          [ $status -eq 0 ] || tail -80 test.log
          exit $status

      - name: Tag skærmbilleder i simulatoren
        shell: bash {0}
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/BerlinSightrun.app
          mkdir -p screenshots
          xcrun simctl boot "$SIM_UDID" 2>/dev/null; xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" dk.berlinsightrun -lang da
          sleep 12; xcrun simctl io "$SIM_UDID" screenshot screenshots/1-forside.png
          xcrun simctl terminate "$SIM_UDID" dk.berlinsightrun
          xcrun simctl launch "$SIM_UDID" dk.berlinsightrun -lang da -demoStartKm 16.2
          sleep 25; xcrun simctl io "$SIM_UDID" screenshot screenshots/2-loeb.png
          xcrun simctl terminate "$SIM_UDID" dk.berlinsightrun
          xcrun simctl launch "$SIM_UDID" dk.berlinsightrun -lang en -demoStartKm 20.9
          sleep 45; xcrun simctl io "$SIM_UDID" screenshot screenshots/3-resultat.png
          ls -la screenshots
          # Små JPEG-kopier i loggen, så skærmbillederne kan ses uden at hente artefaktet.
          for f in screenshots/*.png; do
            sips -s format jpeg -s formatOptions 55 -Z 760 "$f" --out "${f%.png}.jpg" > /dev/null
            echo "BEGIN-SHOT $(basename "${f%.png}")"; base64 -i "${f%.png}.jpg" | fold -w 900; echo "END-SHOT"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ios-skaermbilleder
          path: screenshots/*.png

      - name: Byg til iPhone (uden signering)
        shell: bash {0}
        run: |
          xcodebuild build \
            -project ios/BerlinSightrun.xcodeproj \
            -scheme BerlinSightrun \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:|\*\* " build.log || true
          [ $status -eq 0 ] || tail -80 build.log
          exit $status
